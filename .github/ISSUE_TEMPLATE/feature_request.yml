name: Feature request
description: Suggest an enhancement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or developer problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired UX or API, including any data flow or security impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundaries
    attributes:
      label: Implementation checks
      options:
        - label: Browser collection does not initiate page actions
        - label: Any new external data transfer is explicit and documented
        - label: Credential and local API token handling remains protected
        - label: Can be verified by unit or integration tests
