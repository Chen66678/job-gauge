<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOSS JD Reader</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        width: 280px;
        padding: 16px;
        margin: 0;
        color: #222;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 14px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 0;
        border-top: 1px solid #eee;
      }
      .row:first-of-type {
        border-top: 0;
        padding-top: 0;
      }
      .label {
        font-size: 13px;
        font-weight: 600;
      }
      .hint {
        margin-top: 3px;
        font-size: 11px;
        color: #777;
      }
      .switch-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .switch {
        position: relative;
        width: 42px;
        height: 24px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        border-radius: 12px;
        background: #bbb;
        cursor: pointer;
        transition: background 0.2s;
      }
      .slider::before {
        content: '';
        position: absolute;
        width: 18px;
        height: 18px;
        left: 3px;
        top: 3px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.2s;
        box-shadow: 0 1px 3px rgb(0 0 0 / 25%);
      }
      input:checked + .slider {
        background: #06ae56;
      }
      input:checked + .slider::before {
        transform: translateX(18px);
      }
      #toggle-state {
        min-width: 25px;
        font-size: 12px;
        font-weight: 700;
      }
      #toggle-state.enabled {
        color: #06ae56;
      }
      #toggle-state.disabled {
        color: #777;
      }
      #collected-count {
        font-size: 22px;
        font-weight: 700;
        color: #06ae56;
      }
    </style>
  </head>
  <body>
    <h1>BOSS JD Reader</h1>
    <div class="row">
      <div>
        <div class="label">常驻自动采集</div>
        <div class="hint">关闭后切换职位不会自动发送</div>
      </div>
      <div class="switch-wrap">
        <label class="switch" aria-label="常驻自动采集">
          <input id="auto-collect-toggle" type="checkbox" />
          <span class="slider"></span>
        </label>
        <span id="toggle-state" class="enabled">ON</span>
      </div>
    </div>
    <div class="row">
      <div class="label">已采集职位</div>
      <span id="collected-count">0</span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
