<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOSS JD Reader</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        width: 280px;
        padding: 16px;
        margin: 0;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      p {
        font-size: 13px;
        color: #444;
        margin: 0 0 12px;
      }
      button {
        width: 100%;
        padding: 8px 12px;
        font-size: 13px;
        border: none;
        border-radius: 6px;
        background: #06ae56;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        background: #9bd9b6;
        cursor: default;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #666;
        word-break: break-word;
      }
      #status.error {
        color: #c0392b;
      }
      #status.success {
        color: #06ae56;
      }
    </style>
    <script type="module" crossorigin src="/chunks/popup-BVunSs6r.js"></script>
  </head>
  <body>
    <h1>BOSS JD Reader</h1>
    <p id="message">检测中...</p>
    <button id="send-btn" style="display: none">发送到应用</button>
    <div id="status"></div>
  </body>
</html>
